services:
  obolonka:
    build:
      context: ./obolonka
    ports:
      - "5173:3000"
    networks:
      - mererza

  backend-service:
    # build: ./backend
    image: dkolodko/diplom-backend:latest
    ports:
      - "6005:8000" 
    restart: always

  backend_troian:
    image: vitaliktroian04/smart-energy-stability:latest
    ports:
      - "6028:8085"
    restart: always

  backend_dosmukhamedov:
    image: xerarobespierre/hybridinvertor-backend-1:latest
    ports:
      - "6050:6050"
    restart: always

  pokazovaSlurzba:
    image: bondarenkorodion/slurzba1
    ports:
      - "3000:3000"
    networks:
      - mererza

  smartenergy-backend:
    image: puvlichok/smartenergy-backend
    ports:
    - "6007:6007"


# [Початок] Монастирний Моніторинг
  influxdb:
    image: influxdb:2-alpine
    ports: ["6029:8086"]
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=secretpassword_smartenergy6
      - DOCKER_INFLUXDB_INIT_ORG=KPI
      - DOCKER_INFLUXDB_INIT_BUCKET=smart_energy
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=secretpassword_smartenergy6

  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd
      - ./mosquitto.acl:/mosquitto/config/mosquitto.acl
    ports:
      - "6030:1883"
      - "6031:9001"

  # ESP32 Simulator Controller
  simulators:
    image: vicmony/monitoring-monastyrnyi-simulators
    depends_on:
      - mosquitto
    environment:
      - BROKER_URL=mqtt://mosquitto:1883
      - MQTT_USER=simulator
      - MQTT_PASSWORD=simulator_pass
      - CLIENT_ID=ESP32_SIMULATOR
      - SENSOR_DATA_TOPIC=sensor/data
      - SIMULATOR_CONTROL_TOPIC=simulator/control
      - SIMULATOR_STATUS_TOPIC=simulator/status

  # Ingestor (Скрипт, що переписує дані з MQTT в InfluxDB)
  ingestor:
    image: vicmony/monitoring-monastyrnyi-ingestor
    depends_on:
      - influxdb
      - mosquitto
    environment:
      - TZ=Europe/Kyiv
      - MQTT_URL=mqtt://mosquitto:1883
      - MQTT_USER=ingestor
      - MQTT_PASSWORD=ingestor_pass
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - INFLUX_ORG=KPI
      - INFLUX_BUCKET=smart_energy
      - DATA_SAVE_TOPIC=sensor-data

  # History API (Microservice for historical data)
  history-api:
    image: vicmony/monitoring-monastyrnyi-history-api
    ports:
      - "6032:6032"
    depends_on:
      - influxdb
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - INFLUX_ORG=KPI
      - INFLUX_BUCKET=smart_energy
      - PORT=6032
      - DATA_SAVE_TOPIC=sensor-data
# [Кінець] Монастирний Моніторинг


# START Шевченко Анастасія Володимирівна
# Functional Stability

  functional-stability-shevchenko:
    image: mistressmorgana/energy-backend:latest
    ports:
      - "6040:8000"
    restart: unless-stopped

# END Шевченко Анастасія Володимирівна

  # START Шевченко Олександр Олександрович
  # Document Storage API
  document-storage-api:
    image: tv52mpshevchenkoo/smartenergy-docs-storage:latest
    ports:
      - "6066:8000"
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      MONGO_URI: mongodb://document-storage-mongo:27017
      MONGO_DB: document_storage
      REDIS_URL: redis://document-storage-redis:6379/0
      SECRET_KEY: "${DOCUMENT_STORAGE_SECRET_KEY:?Set DOCUMENT_STORAGE_SECRET_KEY in .env}"
      CORS_ORIGINS: http://localhost:5173
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_USERNAME: "${DOCUMENT_STORAGE_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${DOCUMENT_STORAGE_ADMIN_PASSWORD:?Set DOCUMENT_STORAGE_ADMIN_PASSWORD in .env}"
      RATE_LIMIT_ENABLED: "true"
    depends_on:
      document-storage-mongo:
        condition: service_healthy
      document-storage-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - document-storage

  document-storage-mongo:
    image: mongo:8.0.32
    restart: unless-stopped
    volumes:
      - document_storage_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - document-storage

  document-storage-redis:
    image: redis:8.2.10-alpine
    restart: unless-stopped
    volumes:
      - document_storage_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - document-storage
# END Шевченко Олександр Олександрович

  backend-kravchenko:
    image: nastensii/smart-energy-backend:latest
    container_name: smart_energy_api_kravchenko
    ports:
      - "6006:8000"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=secretpassword_smartenergy6
      - MQTT_BROKER=broker.hivemq.com
      - MQTT_PORT=1883

  backend_yaroslav:
    image: yaroslav333/my-backend:latest
    ports:
      - "6001:5000"
    restart: always
    environment:
      - MONGO_URL=mongodb://mongodb:27017/solar_system
    networks:
      - mererza
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mererza

networks:
  mererza:
    driver: bridge
  document-storage:
    driver: bridge

volumes:
  influxdb_data: # оголошено том для всього проєкту
  mongo_data:
  document_storage_mongo_data:
  document_storage_redis_data:
